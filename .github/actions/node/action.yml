# THE SETUP EVERY WORKFLOW REPEATS, once.
#
# Measured 2026-09-20: eight workflows, each pinning actions/setup-node by SHA and most calling `npm ci`.
# Eleven copies of one pin. A pinned SHA is a supply-chain decision, and a decision recorded in eleven places
# is one that gets updated in ten — the same story src/html/index.ts tells about HTML escaping, at the layer
# where being wrong costs more than a broken page.
#
# `actions/checkout` stays in each workflow and cannot move here: a local composite action does not exist
# until the repository has been checked out. That is a real limit, so it is stated rather than worked around.
name: node
description: The Node version this repository builds with, its dependencies, and optionally the Lean kernel it pins.

inputs:
  deps:
    description: run npm ci (set "false" for jobs that only need node itself)
    required: false
    default: 'true'
  kernel:
    description: install the Lean toolchain named in lean-toolchain
    required: false
    default: 'false'
  cache:
    description: npm cache key for setup-node ("npm", or empty for none)
    required: false
    default: ''
  registry-url:
    description: npm registry, for the job that publishes
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}
    - if: inputs.deps == 'true'
      shell: bash
      run: npm ci
    # The kernel is installed from the version this repository pins, never "latest": a toolchain that moves
    # under a proof is a proof about a different system.
    - if: inputs.kernel == 'true'
      shell: bash
      # THE INSTALLER IS NOT DOWNLOADED INTO THE REPOSITORY. This wrote elan-init.sh to the working
      # directory and left it there, so every job using `kernel` finished with an untracked file in the
      # tree. Nothing caught it until release.yml asked for the kernel: release.ts mints its tag in
      # tag-only mode, which refuses a dirty tree — correctly, since the tag claims a content-address HEAD
      # must carry — and the whole release failed on `?? elan-init.sh`. discovery.yml had been dropping the
      # same file for as long as it has used this input, and mints no tag, so nobody saw it.
      #
      # Piped straight to sh, so nothing is written into the checkout at all. A tool that leaves an
      # artefact behind is a tool whose next caller inherits a defect it did not cause.
      run: |
        set -euo pipefail
        curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
          | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - if: inputs.kernel == 'true'
      shell: bash
      run: lean --version
