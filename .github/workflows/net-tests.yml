# The network tests. They observe live services, so they run here and nowhere else: the local hooks do not run them.
# CI=true makes an absent network a failure, never a skip. Every suite must report PASS.
name: net-tests
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
jobs:
  net:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # deps 'false' ran these suites with no node_modules: the first case to import a registry unit failed before it
      # measured anything, and the Lean pin was typed here a second time instead of read from lean-toolchain. The
      # composite action installs both from the one place each is declared.
      - uses: ./.github/actions/node
        with:
          deps: 'true'
          kernel: 'true'
      # web_fetch reads a PDF's text through pdftotext (poppler); the runner image has none, and the rules-PDF case read
      # INCONCLUSIVE with no cause printed (2026-11-03). The tool is installed here, where the suite that needs it runs.
      - name: pdftotext (poppler), for the PDF cases
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && pdftotext -v 2>&1 | head -1
      - name: Network suites, each must PASS
        run: |
          for s in net-tools-test answer-doi answer-tool fallbacks; do
            out=$(node scripts/suite-run.ts "$s")
            echo "$out" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$out" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); if (j.status!=="PASS") { console.error("suite "+j.suite+" is "+j.status); process.exit(1) }'
          done
      - name: Online verification and suite security (MCP client)
        run: |
          node scripts/online-verify-e2e-test.ts
          node scripts/run-suite-security-test.ts
