name: Deploy site to GitHub Pages (from main)

# Serve Pages from main: build VitePress on every push to main and deploy the built
# site via the Pages artifact — no gh-pages branch. The custom domain (ceccec.psg.bg)
# is configured at the org Pages level, so nothing here touches it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the deploy: read the repo, write the Pages deployment, mint the OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; let an in-progress run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs — this repo requires SHA pinning (tag refs are rejected).
      # NB: upload-pages-artifact must be v4 or newer. v3 calls actions/upload-artifact@v4 by TAG inside its
      # own composite action, and this repo requires every action pinned to a full commit SHA — a nested tag
      # ref cannot be pinned from here, so v3 is rejected at startup. v5 pins its internal ref to a SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install (locked)
        run: npm ci
      # src/0/{chacha,crypt,sha256,merkle-proof}.ts and src/the/apple import @uuidna/uuidna, and
      # scripts/greeting.ts reads its package.json, so the workspace must be BUILT before the site build —
      # otherwise dist/index.js is missing and predocs:build dies resolving the package.
      # packages/uuidna is COMMITTED but is not an npm workspace — package.json declares no `workspaces`
      # field, so `-w @uuidna/uuidna` fails with "No workspaces found" and took three workflows down with
      # it. The gates do not need that directory built: @uuidna/uuidna is a REGISTRY dependency (^0.2.6 in
      # the lockfile) and `npm ci` installs it. The directory is still built here, by path, because it is
      # part of this repo and a build failure in it should be visible — but it is guarded, so its absence
      # is not fatal to a workflow that does not depend on it.
      - name: Build the uuidna workspace (the site imports it)
        run: |
          if [ -f packages/uuidna/package.json ]; then
            (cd packages/uuidna && npm install --ignore-scripts --no-package-lock && npm run build)
          else
            echo 'packages/uuidna absent — the gates use the registry package'
          fi
      - name: Build the site (predocs:build gates run first)
        # BEFORE THE GATES, and the order is load-bearing. Three of them — import-gate, security-gate
        # and gaps — read .vitepress/dist, so running them first meant import-gate exiting 1 with
        # "no dist/" and the deploy failing in 18 seconds. It passed locally every time because a
        # developer always has dist/ lying around from the last build; CI starts clean, which is the
        # environment the check is actually for.
        run: npm run docs:build
      - name: Emit the verifiable metrics face, and fail on any red gate
        # ONE RUN, NOT TWO. This step used to be preceded by `npm run gates`, and metrics runs that same
        # chain to fill its rows — so the eleven gates ran twice on every deploy, 10.3s of the ~22s those
        # two steps took being the identical work done again. The face still PUBLISHES a red gate rather
        # than hiding it, which is why it exits 0; `--enforce` reads the rows it just wrote and fails the
        # build on any FAIL. Both properties kept, the chain run once.
        run: npm run metrics:enforce
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
