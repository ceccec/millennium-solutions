name: Release — gate, then mint the provenance tag

# Automated release. Every push to main runs the full gate chain; if the content-address has MOVED since
# the last tag, release.ts mints the next single-digit-odometer tag, gravity-signed, and a GitHub Release
# is cut from it. If the address is unchanged the run exits quietly — no tag, no release, no drained work.
#
# TAG ONLY, never a commit: main requires signed commits and pull requests, and the Actions token can
# bypass neither, so RELEASE_TAG_ONLY=1 tags the existing HEAD instead of committing a regenerated tree.
# Tags are not covered by the branch ruleset, so pushing one is permitted.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push the tag and create the release
  actions: write    # dispatch publish.yml for the minted tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # release.ts derives the next version from the full tag history
      - uses: ./.github/actions/node
        with:
          deps: 'false'
          cache: npm
          # THE KERNEL RUNS HERE OR THE TAG MEANS LESS THAN IT SAYS. This job mints the provenance tag, cuts
          # the release and dispatches the npm publish, and until 2026-09-21 it did all of that without Lean
          # installed — seven checks, none of them a compile. What stood in for the kernel was
          # scripts/lean-claims.ts, which re-implements each theorem's arithmetic in TypeScript and says so
          # in its own header: "no Lean toolchain needed". That is two derivations of one fact, and CI
          # trusted the one that is not the kernel.
          #
          # The cost of that was measured the same day: scripts/lean.ts compiled imported modules in
          # directory order, so a clean checkout could not build the Lean layer at all — and this workflow
          # could not have noticed, because it never built it. The composite action has supported `kernel`
          # all along; this job simply never asked.
          kernel: 'true'
      - run: npm ci
      # packages/uuidna is COMMITTED but is not an npm workspace — package.json declares no `workspaces`
      # field, so `-w @uuidna/uuidna` fails with "No workspaces found" and took three workflows down with
      # it. The gates do not need that directory built: @uuidna/uuidna is a REGISTRY dependency (^0.2.6 in
      # the lockfile) and `npm ci` installs it. The directory is still built here, by path, because it is
      # part of this repo and a build failure in it should be visible — but it is guarded, so its absence
      # is not fatal to a workflow that does not depend on it.
      - name: Build the uuidna workspace (the gates import it)
      # --no-package-lock: this is an ad-hoc build of a directory that is not an npm workspace, and a
      # lockfile written here is an untracked artefact. release.yml's tag-only mode refuses a dirty tree
      # — correctly, since the tag claims a content-address HEAD must carry — so generating one broke the
      # release a second time, one layer past the first break.
        run: |
          if [ -f packages/uuidna/package.json ]; then
            (cd packages/uuidna && npm install --ignore-scripts --no-package-lock && npm run build)
          else
            echo 'packages/uuidna absent — the gates use the registry package'
          fi

      # --- the gates: nothing is tagged unless every one of them holds ---
      # THE KERNEL FIRST. Every other check in this job reasons about theorems; this is the one that decides
      # whether Lean accepts them, on a runner with no .olean files from any earlier run — which is the only
      # environment that tests what a reader gets when they clone.
      - name: lean (the kernel accepts every theorem, from a cold checkout)
        run: node scripts/lean.ts
      - name: contradictions (the prose and the proofs agree)
        run: node scripts/contradictions.ts
      # 0.16 seconds, and it guards the claim llms.txt makes in this deposit's own voice: that it can be
      # checked with lean and node and nothing else. It was absent from the local chain too until today,
      # which is how a network call reached the verification path and survived a full green run.
      - name: independent (no network, credential or model on the verification path)
        run: node scripts/independent.ts
      - name: gaps (coverage)
        run: node scripts/gaps.ts
      - name: seal (consistency, 0/7)
        run: node scripts/seal.ts
      - name: wholeness (the aura is whole)
        run: node scripts/wholeness.ts
      - name: lean-claims (the formal layer recomputes)
        run: node scripts/lean-claims.ts
      - name: gate-corpus (every theorem passes the gate in isolation)
        run: node scripts/gate-corpus.ts
      - name: claims-gate (registered claims recompute)
        run: node scripts/claims-gate.ts
      - name: forensics (chain of custody, tamper-evident)
        run: node scripts/forensics.ts

      # ── THE GATES A LOCAL COMMIT PASSES, WHICH A RELEASE WAS NOT PASSING ──────────────────────────────
      # Measured 2026-09-25: this workflow reached 11 of the 30 scripts the local chains run. Twenty-eight
      # gates that refuse a commit on this machine — prose-trial, attribution, security, orphan, hardcode,
      # cite-audit, vacuity, lean-agree, carry, coils, formulas and the rest — never ran before a tag was
      # cut. The tag is immutable provenance and it triggers publish.yml, so a release was being published
      # on LESS evidence than an ordinary commit, which is exactly backwards.
      #
      # `npm run gates` rather than a list of twenty-eight steps: the chain is the tree's own statement of
      # what must hold, and a copy of it here would be a second list to keep in step.
      - name: gates (every refusing check a local commit passes)
        run: npm run gates

      # And the artefact, not only the source. scripts/e2e.ts checks what a reader opens — the page
      # references its data, the counts agree, every linked theorem page exists — and it needs the build.
      - name: build the site, then check it as a reader meets it
        run: npm run docs:build

      # An ANNOTATED tag carries an author, so the runner needs an identity or `git tag -a` fails.
      - name: identity for the annotated tag
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # --- mint the tag only if the content-address moved ---
      - name: release — mint the provenance tag if there is a delta
        id: rel
        env:
          RELEASE_TAG_ONLY: '1'
        run: |
          before=$(git tag --sort=version:refname | tail -1)
          node scripts/release.ts
          after=$(git tag --sort=version:refname | tail -1)
          if [ "$before" = "$after" ]; then
            echo "no delta — content-address unchanged since $before; nothing to release"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "minted $after"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: push the tag
        if: steps.rel.outputs.tag != ''
        run: git push origin "${{ steps.rel.outputs.tag }}"

      - name: cut the GitHub Release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          # the annotated tag's own message carries the gravity signature and the content-address
          git for-each-ref "--format=%(contents)" "refs/tags/$tag" > /tmp/notes.txt
          gh release create "$tag" --title "$tag" --notes-file /tmp/notes.txt --verify-tag

      # THE PUBLISH, DISPATCHED — NOT CALLED. The release above is created with the Actions token, and GitHub
      # never lets an event made by that token start another workflow, except workflow_dispatch. Calling
      # publish.yml as a reusable workflow did start it, but npm's trusted publishing refused that identity
      # ("package not found", v9.0.3–v9.0.5) while a run of publish.yml on its own published 9.0.4. So the tag is
      # handed to publish.yml as a dispatch: its own run, its own OIDC identity, release vX.Y.Z → npm X.Y.Z.
      - name: dispatch the npm publish for this tag
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main -f tag='${{ steps.rel.outputs.tag }}'
