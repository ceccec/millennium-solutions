name: Release — gate, then mint the provenance tag

# Automated release. Every push to main runs the full gate chain; if the content-address has MOVED since
# the last tag, release.ts mints the next single-digit-odometer tag, gravity-signed, and a GitHub Release
# is cut from it. If the address is unchanged the run exits quietly — no tag, no release, no drained work.
#
# TAG ONLY, never a commit: main requires signed commits and pull requests, and the Actions token can
# bypass neither, so RELEASE_TAG_ONLY=1 tags the existing HEAD instead of committing a regenerated tree.
# Tags are not covered by the branch ruleset, so pushing one is permitted.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push the tag and create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # release.ts derives the next version from the full tag history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # packages/uuidna is COMMITTED but is not an npm workspace — package.json declares no `workspaces`
      # field, so `-w @uuidna/uuidna` fails with "No workspaces found" and took three workflows down with
      # it. The gates do not need that directory built: @uuidna/uuidna is a REGISTRY dependency (^0.2.6 in
      # the lockfile) and `npm ci` installs it. The directory is still built here, by path, because it is
      # part of this repo and a build failure in it should be visible — but it is guarded, so its absence
      # is not fatal to a workflow that does not depend on it.
      - name: Build the uuidna workspace (the gates import it)
        run: |
          if [ -f packages/uuidna/package.json ]; then
            (cd packages/uuidna && npm install --ignore-scripts && npm run build)
          else
            echo 'packages/uuidna absent — the gates use the registry package'
          fi

      # --- the gates: nothing is tagged unless every one of them holds ---
      - name: gaps (coverage)
        run: node scripts/gaps.ts
      - name: seal (consistency, 0/7)
        run: node scripts/seal.ts
      - name: wholeness (the aura is whole)
        run: node scripts/wholeness.ts
      - name: lean-claims (the formal layer recomputes)
        run: node scripts/lean-claims.ts
      - name: gate-corpus (every theorem passes the gate in isolation)
        run: node scripts/gate-corpus.ts
      - name: claims-gate (registered claims recompute)
        run: node scripts/claims-gate.ts
      - name: forensics (chain of custody, tamper-evident)
        run: node scripts/forensics.ts

      # An ANNOTATED tag carries an author, so the runner needs an identity or `git tag -a` fails.
      - name: identity for the annotated tag
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # --- mint the tag only if the content-address moved ---
      - name: release — mint the provenance tag if there is a delta
        id: rel
        env:
          RELEASE_TAG_ONLY: '1'
        run: |
          before=$(git tag --sort=version:refname | tail -1)
          node scripts/release.ts
          after=$(git tag --sort=version:refname | tail -1)
          if [ "$before" = "$after" ]; then
            echo "no delta — content-address unchanged since $before; nothing to release"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "minted $after"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: push the tag
        if: steps.rel.outputs.tag != ''
        run: git push origin "${{ steps.rel.outputs.tag }}"

      - name: cut the GitHub Release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          # the annotated tag's own message carries the gravity signature and the content-address
          git for-each-ref "--format=%(contents)" "refs/tags/$tag" > /tmp/notes.txt
          gh release create "$tag" --title "$tag" --notes-file /tmp/notes.txt --verify-tag
