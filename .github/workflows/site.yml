name: Deploy site to gh-pages

# The fold removed the workspace chicken-egg, so CI npm install resolves cleanly (only devDeps:
# vitepress + vue). This moves the last manual step into CI: push to main -> build -> gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install (devDeps only)
        run: npm install --no-audit --no-fund
      - name: build
        run: npm run docs:build
      - name: publish to gh-pages
        run: |
          cd .vitepress/dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git -c user.name="Singularity" -c user.email="ceccec@psg.bg" add -A
          git -c user.name="Singularity" -c user.email="ceccec@psg.bg" commit -qm "site: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
